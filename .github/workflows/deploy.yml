name: Deploy with Drift Guard

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip database migrations"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  precheck:
    name: Check live server drift
    runs-on: [self-hosted, linux]
    environment: production

    permissions:
      contents: write
      pull-requests: write

    outputs:
      should_deploy: ${{ steps.drift.outputs.should_deploy }}
      drift_branch: ${{ steps.drift.outputs.drift_branch }}

    env:
      DEPLOY_PATH: /home/saassmar/domains/cleansm.art/public_html
      DEPLOY_BRANCH: production
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Verify runner context
        shell: bash
        run: |
          echo "==> Runner host   : $(hostname)"
          echo "==> Running as    : $(whoami)"
          echo "==> Deploy path   : $DEPLOY_PATH"
          echo "==> Deploy branch : $DEPLOY_BRANCH"

      - name: Verify deployment directory
        shell: bash
        run: |
          set -e
          [ -d "$DEPLOY_PATH" ] || { echo "::error::Deploy path does not exist: $DEPLOY_PATH"; exit 1; }
          [ -d "$DEPLOY_PATH/.git" ] || { echo "::error::$DEPLOY_PATH is not a git working tree."; exit 1; }
          [ -f "$DEPLOY_PATH/.env" ] || { echo "::error::.env not found at $DEPLOY_PATH/.env"; exit 1; }

      - name: Prepare git working tree
        shell: bash
        run: |
          set -e
          cd "$DEPLOY_PATH"
          git config --global --add safe.directory "$DEPLOY_PATH" || true
          [ ! -f .git/index.lock ] || rm -f .git/index.lock

      - name: Normalize branch and fetch refs
        shell: bash
        run: |
          set -e
          cd "$DEPLOY_PATH"

          cp .env /tmp/.deploy_env_backup

          git stash push -m "precheck-temp-$(date +%s)" \
            bootstrap/cache \
            .phpunit.result.cache \
            || true

          git fetch --all --prune
          git checkout "$DEPLOY_BRANCH" || git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"

          mv /tmp/.deploy_env_backup .env

      - name: Detect drift and capture if needed
        id: drift
        shell: bash
        run: |
          set -e
          cd "$DEPLOY_PATH"

          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          DRIFT_BRANCH="server-drift/$TIMESTAMP"

          TRACKED_DRIFT="$(git diff --name-only "origin/$DEPLOY_BRANCH" -- \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            Modules \
            artisan \
            composer.json \
            composer.lock \
            package.json \
            package-lock.json \
            webpack.mix.js \
            vite.config.* \
            .env.example || true)"

          UNTRACKED_DRIFT="$(git ls-files --others --exclude-standard -- \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            Modules \
            artisan \
            composer.json \
            composer.lock \
            package.json \
            package-lock.json \
            webpack.mix.js \
            vite.config.* \
            .env.example || true)"

          echo "==> Tracked drift:"
          echo "$TRACKED_DRIFT"
          echo "==> Untracked drift:"
          echo "$UNTRACKED_DRIFT"

          if [ -z "$TRACKED_DRIFT" ] && [ -z "$UNTRACKED_DRIFT" ]; then
            echo "==> No drift found."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "drift_branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "==> Drift detected. Capturing review branch and stopping deploy."

          cp .env /tmp/.deploy_env_backup

          git branch -D "$DRIFT_BRANCH" 2>/dev/null || true
          git checkout -b "$DRIFT_BRANCH"

          git add \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            Modules \
            artisan \
            composer.json \
            composer.lock \
            package.json \
            package-lock.json \
            webpack.mix.js \
            vite.config.* \
            .env.example || true

          if git diff --cached --quiet; then
            echo "==> Nothing staged after filtering."
            git checkout "$DEPLOY_BRANCH" || true
            mv /tmp/.deploy_env_backup .env
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "drift_branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Capture live server drift before deploy ($TIMESTAMP)"
          git push origin "$DRIFT_BRANCH"

          gh pr create \
            --base "$DEPLOY_BRANCH" \
            --head "$DRIFT_BRANCH" \
            --title "Server drift capture: $TIMESTAMP" \
            --body "This draft PR captures code differences found on the live server before deployment." \
            --draft

          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH" || git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          mv /tmp/.deploy_env_backup .env

          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          echo "drift_branch=$DRIFT_BRANCH" >> "$GITHUB_OUTPUT"

          echo "::warning::Server drift found. Draft PR created. Deployment stopped for review."

  deploy:
    name: Deploy to production
    runs-on: [self-hosted, linux]
    environment: production
    needs: precheck
    if: needs.precheck.outputs.should_deploy == 'true'

    permissions:
      contents: read

    env:
      DEPLOY_PATH: /home/saassmar/domains/cleansm.art/public_html
      DEPLOY_BRANCH: production

    steps:
      - name: Verify runner context
        shell: bash
        run: |
          echo "==> Runner host   : $(hostname)"
          echo "==> Running as    : $(whoami)"
          echo "==> Deploy path   : $DEPLOY_PATH"
          echo "==> Deploy branch : $DEPLOY_BRANCH"

      - name: Verify deployment directory and .env
        shell: bash
        run: |
          set -e
          [ -d "$DEPLOY_PATH" ] || { echo "::error::Deploy path does not exist: $DEPLOY_PATH"; exit 1; }
          [ -d "$DEPLOY_PATH/.git" ] || { echo "::error::$DEPLOY_PATH is not a git working tree."; exit 1; }
          [ -f "$DEPLOY_PATH/.env" ] || { echo "::error::.env not found at $DEPLOY_PATH/.env"; exit 1; }

      - name: Prepare git working tree
        shell: bash
        run: |
          set -e
          cd "$DEPLOY_PATH"
          git config --global --add safe.directory "$DEPLOY_PATH" || true
          [ ! -f .git/index.lock ] || rm -f .git/index.lock

      - name: Normalize to deploy branch without deleting server files
        shell: bash
        run: |
          set -e
          cd "$DEPLOY_PATH"

          cp .env /tmp/.deploy_env_backup

          git stash push -m "deploy-temp-$(date +%s)" \
            bootstrap/cache \
            .phpunit.result.cache \
            || true

          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH" || git checkout -b "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          git pull --no-rebase origin "$DEPLOY_BRANCH"

          mv /tmp/.deploy_env_backup .env

      - name: Install Composer dependencies
        shell: bash
        run: |
          set -e
          cd "$DEPLOY_PATH"
          php -v
          composer --version
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Run database migrations
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_migrations != 'true'
        shell: bash
        run: |
          set -e
          cd "$DEPLOY_PATH"
          php artisan migrate --force --no-interaction

      - name: Rebuild application caches
        shell: bash
        run: |
          set -e
          cd "$DEPLOY_PATH"
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache || echo "::warning::route:cache failed."
          php artisan view:cache || echo "::warning::view:cache failed."

      - name: Restart queue workers
        shell: bash
        run: |
          cd "$DEPLOY_PATH"
          php artisan queue:restart || true

      - name: Post-deploy health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        shell: bash
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret not set — skipping health check."
            exit 0
          fi

          HTTP_CODE="$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 "$APP_URL")"
          echo "HTTP response: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Health check returned HTTP $HTTP_CODE"
          else
            echo "==> Health check passed."
          fi
        continue-on-error: true
