name: Drift Check + Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip database migrations"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  precheck:
    name: Check live server drift
    runs-on: [self-hosted, linux]
    environment: production

    permissions:
      contents: write
      pull-requests: write

    outputs:
      should_deploy: ${{ steps.result.outputs.should_deploy }}
      drift_branch: ${{ steps.result.outputs.drift_branch }}

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/saassmar/domains/cleansm.art/public_html' }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Verify deployment directory
        run: |
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "::error::Deploy path does not exist: $DEPLOY_PATH"
            exit 1
          fi

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "::error::$DEPLOY_PATH is not a git working tree."
            exit 1
          fi

          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            echo "::error::.env not found at $DEPLOY_PATH/.env"
            exit 1
          fi

      - name: Fetch latest refs
        run: |
          cd "$DEPLOY_PATH"
          git fetch --all --prune

      - name: Detect drift and capture if needed
        id: result
        run: |
          cd "$DEPLOY_PATH"

          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          DRIFT_BRANCH="server-drift/$TIMESTAMP"

          # Make sure runtime/server-only paths are not part of the review branch.
          TRACKED_DRIFT="$(git diff --name-only -- app routes resources config Modules public || true)"
          UNTRACKED_DRIFT="$(git ls-files --others --exclude-standard -- app routes resources config Modules public || true)"

          if [ -z "$TRACKED_DRIFT" ] && [ -z "$UNTRACKED_DRIFT" ]; then
            echo "No drift found."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "drift_branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Drift detected:"
          echo "$TRACKED_DRIFT"
          echo "$UNTRACKED_DRIFT"

          # Preserve .env before branch work
          cp .env /tmp/.deploy_env_backup

          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD || echo "$DEPLOY_BRANCH")"

          git checkout -b "$DRIFT_BRANCH"

          git add app routes resources config Modules public

          if git diff --cached --quiet; then
            echo "Nothing staged after filtering."
            git checkout "$CURRENT_BRANCH" || true
            mv /tmp/.deploy_env_backup .env
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "drift_branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Capture live server drift before deploy ($TIMESTAMP)"
          git push origin "$DRIFT_BRANCH"

          gh pr create \
            --base "$DEPLOY_BRANCH" \
            --head "$DRIFT_BRANCH" \
            --title "Server drift capture: $TIMESTAMP" \
            --body "This draft PR captures code differences found on the live server before deployment." \
            --draft

          # Return working tree to deploy branch, but stop the workflow before deploy.
          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH" || git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          mv /tmp/.deploy_env_backup .env

          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          echo "drift_branch=$DRIFT_BRANCH" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    runs-on: [self-hosted, linux]
    environment: production
    needs: precheck
    if: needs.precheck.outputs.should_deploy == 'true'

    permissions:
      contents: read

    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/saassmar/domains/cleansm.art/public_html' }}
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}

    steps:
      - name: Verify runner context
        run: |
          echo "==> Runner host : $(hostname)"
          echo "==> Running as  : $(whoami)"
          echo "==> Deploy path : $DEPLOY_PATH"
          echo "==> Deploy branch: $DEPLOY_BRANCH"

      - name: Verify deployment directory and .env
        run: |
          if [ ! -d "$DEPLOY_PATH" ]; then
            echo "::error::Deploy path does not exist: $DEPLOY_PATH"
            exit 1
          fi

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "::error::$DEPLOY_PATH is not a git working tree."
            exit 1
          fi

          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            echo "::error::.env not found at $DEPLOY_PATH/.env"
            exit 1
          fi

      - name: Reset server to canonical branch
        run: |
          cd "$DEPLOY_PATH"

          if [ -f .env ]; then
            cp .env /tmp/.deploy_env_backup
          fi

          git fetch origin "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

          if [ -f /tmp/.deploy_env_backup ]; then
            mv /tmp/.deploy_env_backup .env
          fi

      - name: Install Composer dependencies
        run: |
          cd "$DEPLOY_PATH"
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Run database migrations
        if: github.event.inputs.skip_migrations != 'true'
        run: |
          cd "$DEPLOY_PATH"
          php artisan migrate --force --no-interaction

      - name: Rebuild application caches
        run: |
          cd "$DEPLOY_PATH"
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache || echo "::warning::route:cache failed."
          php artisan view:cache || echo "::warning::view:cache failed."

      - name: Restart queue workers
        run: |
          cd "$DEPLOY_PATH"
          php artisan queue:restart || true

      - name: Post-deploy health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret not set — skipping health check."
            exit 0
          fi

          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 "$APP_URL")
          echo "HTTP response: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "::warning::Health check returned HTTP $HTTP_CODE"
          fi
        continue-on-error: true
