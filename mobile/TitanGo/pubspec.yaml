name: titan_go
description: Titan Go — Field worker execution app for Worksuite FSM / CleanSmartOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  get: ^4.6.6

  # HTTP client
  http: ^1.2.1
  dio: ^5.4.3

  # Local storage / offline cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Auth / security
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Firebase / push notifications
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.2
  flutter_local_notifications: ^17.2.1+1

  # Location / GPS
  geolocator: ^11.1.0
  google_maps_flutter: ^2.6.1

  # Camera / media
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  cached_network_image: ^3.3.1

  # UI
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  timeago: ^3.6.1
  shimmer: ^3.0.0
  signature: ^5.4.1      # signature capture widget

  # Utils
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  workmanager: ^0.5.2    # background tasks (GPS heartbeat, sync retry)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/language/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
